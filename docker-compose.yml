name: internship-odoo-crm

services:
  db:
    image: postgres:15
    container_name: internship_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    ports:
      # Loopback only: reachable from this machine (psql, IDE) but not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:19.0
    container_name: internship_odoo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      HOST: db
      PORT: "5432"
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:-change-this-local-master-password}
    ports:
      - "8069:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./config:/etc/odoo
    command: --config /etc/odoo/odoo.conf

volumes:
  postgres_data:
  odoo_data:
