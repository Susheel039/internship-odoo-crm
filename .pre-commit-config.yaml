# Install once: pip install pre-commit && pre-commit install
# Run everything: make lint   (pre-commit run --all-files)
exclude: ^(backups/|\.odoo-src/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-xml
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/  # VS Code JSON allows comments
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: ^scripts/_lib\.sh$  # sourced, not executed

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/OCA/pylint-odoo
    rev: v10.0.11
    hooks:
      - id: pylint_odoo
        args: [--rcfile=.pylintrc]
        files: ^custom_addons/
